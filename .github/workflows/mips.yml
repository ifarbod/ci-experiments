name: MIPS

on:
#   push:
#     branches: [ "master" ]
#   pull_request:
#     branches: [ "master" ]
  workflow_dispatch:

jobs:
  cross-mips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Add Debian Sid sources and install g++-16 cross-compiler
        run: |
          # 1. Fetch missing Debian archive GPG keys directly into APT trusted keys
          sudo gpg --no-default-keyring --keyring /etc/apt/trusted.gpg.d/debian-official-archive-keyring.gpg \
            --keyserver keyserver.ubuntu.com \
            --recv-keys 6ED0E7B82643E131 78DBA3BC47EF2265

          # 2. Add Debian Sid repository
          echo "deb http://deb.debian.org/debian sid main" | sudo tee /etc/apt/sources.list.d/debian-sid.list

          # 3. Configure Apt Pinning to prevent Debian Sid from upgrading Ubuntu system packages
          sudo tee /etc/apt/preferences.d/debian-sid-pin > /dev/null << 'EOF'
          Package: *
          Pin: release o=Debian,a=unstable
          Pin-Priority: 100

          Package: *mips64el-linux-gnuabi64*
          Pin: release o=Debian,a=unstable
          Pin-Priority: 990
          EOF

          # 4. Update apt index and install the cross-compiler
          sudo apt-get update
          sudo apt-get install -y g++-16-mips64el-linux-gnuabi64

      - name: Verify GCC version
        run: |
          mips64el-linux-gnuabi64-g++-16 -v
