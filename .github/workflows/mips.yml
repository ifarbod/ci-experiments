name: MIPS

on:
#   push:
#     branches: [ "master" ]
#   pull_request:
#     branches: [ "master" ]
  workflow_dispatch:

jobs:
  cross-mips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install g++-16 mips64el cross-compiler via isolated deb extraction
        run: |
          # 1. Create temporary directory for downloads and install directory in /opt
          mkdir -p /tmp/debs /opt/gcc-16-mips64el
          cd /tmp/debs

          # 2. Add Debian Sid repository temporarily to download debs
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://ftp-master.debian.org/keys/archive-key-12.asc | sudo gpg --dearmor -o /etc/apt/keyrings/debian-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian sid main" | sudo tee /etc/apt/sources.list.d/debian-sid.list

          # 3. Download the exact cross-compiler packages and dependencies from Debian Sid
          sudo apt-get update
          apt-get download \
            g++-16-mips64el-linux-gnuabi64 \
            gcc-16-mips64el-linux-gnuabi64 \
            cpp-16-mips64el-linux-gnuabi64 \
            binutils-mips64el-linux-gnuabi64 \
            gcc-16-mips64el-linux-gnuabi64-base \
            gcc-16-cross-base-mipsen \
            libgcc-16-dev-mips64el-cross \
            libstdc++-16-dev-mips64el-cross \
            libstdc++6-mips64el-cross \
            libc6-dev-mips64el-cross \
            libc6-mips64el-cross \
            libgomp1-mips64el-cross \
            libatomic1-mips64el-cross \
            linux-libc-dev-mips64el-cross \
            libcc1-0 \
            libsframe3

          # 4. Remove Sid source list so APT stays pristine
          sudo rm /etc/apt/sources.list.d/debian-sid.list
          sudo apt-get update

          # 5. Unpack all .deb archives directly into /opt/gcc-16-mips64el without invoking dpkg/apt
          for deb in *.deb; do
            dpkg-deb -x "$deb" /opt/gcc-16-mips64el
          done

          # 6. Add bin directory to PATH for subsequent steps in GitHub Actions
          echo "/opt/gcc-16-mips64el/usr/bin" >> $GITHUB_PATH

      - name: Verify GCC version
        run: |
          mips64el-linux-gnuabi64-g++-16 -v

      - name: Compile code with GCC
        run: |
          mips64el-linux-gnuabi64-g++-16 -v hello.cpp -o hello

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: mips-binary
          path: hello

  run-in-container:
    needs: cross-mips
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alextwothousand/debian-mips64el:bookworm

    steps:
      - name: Download binary artifact
        uses: actions/download-artifact@v7
        with:
          name: mips-binary

      - name: Make executable and run
        run: |
          chmod +x ./hello
          ./hello
